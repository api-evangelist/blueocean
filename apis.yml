apis:
- name: BlueOcean Spark Platform API
  description: >-
    The application backend for BlueOcean's Spark agentic marketing assistant — saved prompts
    and prompt analytics, "Siren" recurring schedules, session document upload, persistent user
    memory, conversation history and widget state, and the brokering of a user's third-party MCP
    server connections through Pipedream Connect. 63 paths, 72 operations.
    THIS IS NOT A PUBLISHED DEVELOPER API. BlueOcean documents no developer program, no
    authentication, no pricing and no rate limits. The contract below is FastAPI's
    auto-generated description of the backend that app.blueocean.ai calls, served publicly and
    anonymously at https://poseidon.blueocean.ai/api/openapi.json alongside a live Swagger UI.
    It is profiled here as an observed public artifact, not as an integration surface API
    Evangelist recommends calling.
  humanURL: https://poseidon.blueocean.ai/api/docs
