x-enrichment:
  date: '2026-08-13'
  status: enriched
  artifacts_added: 13
  pass: local-v1
  note: >-
    Round 2. STEP 0b contract discovery found a live OpenAPI 3.1.0 at
    https://poseidon.blueocean.ai/api/openapi.json — the API base hardcoded by the
    app.blueocean.ai login bundle — after round 1 recorded no API surface.
    Deliberately NOT generated this round, so a later round does not silently redo it:
    skills/ (packaged Agent Skills). The only OpenAPI available describes an undocumented
    product backend with no declared authentication that BlueOcean does not offer to
    third-party developers; publishing agent skills grounded in it would teach agents to call
    a surface the company has not shipped. Also correctly absent: a2a/ (no agent card on any
    host), asyncapi/ (no event or webhook surface), scopes/ (no oauth2 securityScheme),
    grpc/, cli/, sandbox/, components/, changelog/ and decline-codes (none published).
    No WellKnown, SecurityTxt, AgentCard, MCPServer, SDKs, Idempotency, StatusPage,
    Deprecation or Security pointer is emitted — each of those would assert a provider
    surface that the probes in this repo record as absent.
