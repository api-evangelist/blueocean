openapi: 3.2.0
info:
  title: Fast Delete Conversation API
  version: 0.1.0
servers:
- url: /api
tags:
- name: Delete Conversation
paths:
  /delete_conversation:
    delete:
      summary: Delete Conversation
      operationId: delete_conversation_delete_conversation_delete
      parameters:
      - name: thread_id
        in: query
        required: true
        schema:
          type: string
          title: Thread Id
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          title: User Id
      - name: account_id
        in: query
        required: true
        schema:
          type: string
          title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Delete Conversation
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
