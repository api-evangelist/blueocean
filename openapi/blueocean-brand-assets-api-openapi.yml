          - type: 'null'
          title: Name
      additionalProperties: false
      type: object
      required:
      - name
      title: ColorPatch
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ColorCreate:
      properties:
        account_id:
          type: string
          title: Account Id
        hex:
          type: string
          title: Hex
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      additionalProperties: false
      type: object
      required:
      - account_id
      - hex
      title: ColorCreate
    MessagingPatch:
      properties:
        account_id:
          type: string
          title: Account Id
        content:
          type: string
          title: Content
      type: object
      required:
      - account_id
      - content
      title: MessagingPatch
    Body_upload_fonts_brand_assets_fonts_upload_post:
      properties:
        account_id:
          type: string
          title: Account Id
        files:
          items:
            type: string
            format: binary
          type: array
          title: Files
      type: object
      required:
      - account_id
      - files
      title: Body_upload_fonts_brand_assets_fonts_upload_post
    GuidePatch:
      properties:
        account_id:
          type: string
          title: Account Id
        content:
          type: string
          title: Content
      type: object
      required:
      - account_id
      - content
      title: GuidePatch
    GuideUrl:
      properties:
        account_id:
          type: string
          title: Account Id
        url:
          type: string
          title: Url
      type: object
      required:
      - account_id
      - url
      title: GuideUrl
    Body_generate_messaging_brand_assets_messaging_generate_post:
