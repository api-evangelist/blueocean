openapi: 3.2.0
info:
  title: Fast Langsmith API
  version: 0.1.0
servers:
- url: /api
tags:
- name: langsmith_api
paths:
  /langsmith_api/feedback:
    post:
      tags:
      - langsmith_api
      summary: Submit Feedback
      operationId: submit_feedback_langsmith_api_feedback_post
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Json Data
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
