summary: >-
  BlueOcean does NOT publish an MCP server. It is an MCP CLIENT.
  This is the important distinction on this profile and it is easy to get backwards: the
  product backend contract is full of MCP vocabulary — /mcp/connect, /mcp/{provider}/{app}/tools,
  /mcp/{provider}/{app}/tools/call, /mcp/{provider}/{app}/messages, /mcp/health,
  /pipedream/register_mcp, /auth/providers/mcp/servers — but every one of those operations
  exists so that a BlueOcean USER can attach THEIR third-party MCP servers (Google Drive,
  Sheets, Docs and whatever else Pipedream Connect brokers) to a BlueOcean chat session.
  The tools listed by GET /mcp/{provider}/{app}/tools belong to those third parties, not to
  BlueOcean. Nothing on any BlueOcean host answers the MCP protocol for an outside agent.
  No AgentSkill, ToolCrosswalk or MCPServer pointer is emitted for BlueOcean on this basis.
